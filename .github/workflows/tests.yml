name: tests

# Installs kwnt from source the way `brew install alexsergivan/kwant/kwnt` does, then runs the
# formula's test, brew audit and brew style. Runs on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: brew install, test, audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Homebrew, with this checkout as the alexsergivan/kwant tap
        id: brew
        uses: Homebrew/actions/setup-homebrew@main
      - name: brew style
        run: brew style alexsergivan/kwant
      - name: brew audit --strict --online
        run: |
          set -uo pipefail
          status=0
          brew audit --strict --online alexsergivan/kwant/kwnt > audit.log 2>&1 || status=$?
          echo "brew audit exit status: $status"
          cat audit.log
          exit "$status"
      - name: brew install --build-from-source
        run: brew install --build-from-source --verbose alexsergivan/kwant/kwnt
      - name: brew test
        run: brew test --verbose alexsergivan/kwant/kwnt
      - name: kwnt runs
        run: |
          set -euo pipefail
          kwnt --version
          brew linkage --test alexsergivan/kwant/kwnt
